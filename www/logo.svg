<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161822"/>
      <stop offset="50%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>

    <!-- Crimson Primary Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="45%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Crimson Accent Secondary -->
    <linearGradient id="crimsonAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="60%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#FFA19B"/>
    </linearGradient>

    <!-- Metallic Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.03)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.6)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow for Depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Subtle Radial Background Glow -->
  <circle cx="256" cy="256" r="180" fill="#DC2626" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Icon Geometry: The VeloDrop Bolt & Arrow Motif -->
  <!-- Left Wing of 'V' -->
  <path d="M120 128 L196 128 L256 310 L212 310 Z" fill="url(#crimsonAccent)" filter="url(#dropShadow)"/>

  <!-- Right Wing of 'V' / Velocity Arrow -->
  <path d="M392 128 L316 128 L232 370 L256 370 L300 248 L350 248 Z" fill="url(#crimsonGrad)" filter="url(#dropShadow)"/>

  <!-- Central Downward Drop Arrow / Velocity Core -->
  <path d="M256 128 L308 248 L272 248 L272 350 L240 350 L240 248 L204 248 Z" fill="url(#crimsonGrad)" filter="url(#softGlow)"/>

  <!-- Lower Spear Tip (The Drop) -->
  <polygon points="256,410 200,320 312,320" fill="url(#crimsonAccent)"/>

  <!-- Specular High-Gloss Reflection on Corner -->
  <path d="M32 120 C 32 68, 68 32, 120 32 L 256 32 C 140 32, 50 120, 32 240 Z" fill="rgba(255, 255, 255, 0.08)"/>
</svg>
