name: Build Android APK (VeloDrop)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap & Build Android APK
        run: |
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest="https://velodrop-production.up.railway.app/manifest.json" --skipPushNotifications --no-interactive || true
          npx @bubblewrap/cli build --skipSigning || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloDrop-Android-APK
          path: |
            *.apk
            **/*.apk
            **/*.aab
