name: Build Android APK (VeloDrop)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk VeloDrop-v1.0.0-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VeloDrop-Debug-APK
        path: VeloDrop-v1.0.0-debug.apk

    - name: Create or Update GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
        name: VeloDrop v1.0.0 - High-Velocity Media Downloader
        body: |
          ### 🚀 Rilis Resmi VeloDrop v1.0.0
          - **YouTube Engine**: Unduh Video MP4 Full HD & Audio MP3 320kbps.
          - **TikTok Engine**: Unduh Video HD **Tanpa Watermark** super cepat (< 1 detik).
          - **Instagram Engine**: Ekstraksi Reels & Video Publik instan.
          - **In-App Media Player**: Pemutar video & pemutar musik background dengan animasi vinyl disc.
          - **Penyimpanan Langsung**: Simpan langsung ke folder Downloads perangkat.
          - **100% Zero-Emoji UI**: Tampilan modern, responsif, dan elegan.
        files: |
          VeloDrop-v1.0.0-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
