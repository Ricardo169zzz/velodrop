name: Build Android APK (VeloDrop)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies & Build Web Assets
      run: |
        npm install
        npm run build

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk VeloDrop-v1.1.0-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VeloDrop-Debug-APK
        path: VeloDrop-v1.1.0-debug.apk

    - name: Create or Update GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
        name: VeloDrop v1.1.0 - High-Velocity Media Downloader
        body: |
          ### Rilis Resmi VeloDrop v1.1.0
          - **Perbaikan Unduhan TikTok**: Engine direct stream tanpa watermark diperbaiki tuntas dan tersimpan otomatis di riwayat unduhan.
          - **Integrasi FFmpeg Core**: Penggabungan video YouTube Full HD 1080p & audio MP3 kualitas tinggi.
          - **Player & Storage Connector**: Pemutar video in-app, floating background audio, dan tombol simpan ke perangkat berfungsi langsung di APK.
          - **Offline-First UI**: Tampilan dimuat langsung dari internal APK dalam 0 detik tanpa terhalang cache.
          - **Dynamic Platform Header**: Penyesuaian otomatis judul dan hint untuk YouTube, TikTok, dan Instagram.
        files: |
          VeloDrop-v1.1.0-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
